# lab/forks.lock — pinned CSF fork sources for the Phase 14 test lab.
#
# Format (pipe-delimited, 5 fields): id|kind|url|sha256|pin
#   id      stable identifier used by lab/matrix.sh and lab/fetch-forks.sh
#   kind    "tgz" (single downloaded tarball, integrity = sha256 of the file)
#           or "git" (clone + checkout, integrity = exact commit sha; sha256
#           field is "-" because git provides its own content addressing)
#   url     public mirror/release URL (tgz) or git remote URL (git)
#   sha256  sha256sum of the downloaded tgz; "-" for kind=git
#   pin     git commit sha the tag/release/branch must resolve to (also used
#           as the git checkout target for kind=git)
#
# NEVER configserver.com — mirrors only. ConfigServer (configserver.com)
# shut down distribution 2025-08-31; download.configserver.com is dead/at
# risk of domain-takeover squatting. Every row below is a public GitHub
# mirror or fork, pinned by content hash or exact commit so the lab is
# reproducible even if an upstream release asset is replaced.
#
# Refresh procedure: re-download the artefact (or re-clone/re-checkout for
# git), re-hash with `shasum -a 256` (macOS) / `sha256sum` (Linux/CI),
# confirm the new pin against the fork's own release notes/signature if
# available, then update this file in a dedicated commit.
#
# id|kind|url|sha256|pin
