{{- /*
Only create the Secret when a key was actually given.

It used to be `required`, which meant the chart could not be installed at all
without one — and a catalogue install (DigitalOcean Marketplace, GitOps, a
cluster bootstrap) has nowhere to put a secret at install time. Rendering an
empty Secret instead would be worse than none: it looks configured, and nothing
would ever replace it.

With no key the agent installs and idles, and `kubectl create secret` afterwards
connects it. The DaemonSet mounts this optionally for exactly that reason.
*/}}
{{- if and (not .Values.existingSecret) (include "defensia-agent.apiKey" . | trim) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "defensia-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "defensia-agent.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ include "defensia-agent.apiKey" . | trim | b64enc | quote }}
{{- end }}
