{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "defensia-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "defensia-agent.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ required "apiKey is required: --set apiKey=<ORG_API_KEY> (or set existingSecret)" (include "defensia-agent.apiKey" . | trim | default nil) | b64enc | quote }}
{{- end }}
