apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "defensia-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "defensia-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "defensia-agent.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "defensia-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "defensia-agent.serviceAccountName" . }}
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: defensia-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            # Organization API key: multi-use, one key for every node. The
            # entrypoint only takes the register-k8s path when DEFENSIA_API_KEY
            # is set (DEFENSIA_TOKEN is for single-use install tokens).
            - name: DEFENSIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "defensia-agent.secretName" . }}
                  key: {{ include "defensia-agent.secretKey" . }}
            - name: DEFENSIA_SERVER_URL
              value: {{ include "defensia-agent.serverUrl" . | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DAEMONSET_NAME
              value: {{ include "defensia-agent.fullname" . | quote }}
            {{- with include "defensia-agent.clusterName" . }}
            - name: CLUSTER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if not .Values.autoUpdate.enabled }}
            - name: DISABLE_K8S_AUTO_UPDATE
              value: "true"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: host-log
              mountPath: /var/log
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
              readOnly: true
            - name: agent-config
              mountPath: /etc/defensia
      volumes:
        - name: host-log
          hostPath:
            path: /var/log
            type: DirectoryOrCreate
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
        - name: agent-config
          hostPath:
            path: /etc/defensia
            type: DirectoryOrCreate
