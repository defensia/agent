# Defensia Agent Helm Chart — values.yaml

# Your organization API key from defensia.cloud (multi-use: one key registers
# every node).
#
# Optional. Left empty, the agent installs and runs, but stays unconnected until
# a key arrives — create the Secret afterwards and it connects itself, with no
# restart. That is the only way to install from a catalogue that cannot pass a
# secret at install time (DigitalOcean Marketplace, GitOps bootstraps).
apiKey: ""

# Optional: use an existing Secret instead of apiKey (the key is read from
# existingSecretKey, default "api-key").
existingSecret: ""
existingSecretKey: "api-key"

# Container runtime sockets.
#
# Docker is off by default: managed Kubernetes (DOKS, GKE, EKS) runs containerd,
# and mounting a socket that is not there makes kubelet create a directory in its
# place on every node — one that `helm uninstall` leaves behind. Turn it on only
# for a cluster that genuinely runs Docker.
dockerSocket:
  enabled: false
  path: /var/run/docker.sock

containerdSocket:
  path: /run/containerd/containerd.sock

# Defensia server URL (change only for self-hosted)
serverUrl: "https://defensia.cloud"

# Optional: cluster name shown in the panel (sent as CLUSTER_NAME)
clusterName: ""

image:
  repository: ghcr.io/defensia/agent
  tag: ""  # Defaults to appVersion
  pullPolicy: Always

# Resource limits for the agent container
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# DaemonSet tolerations — run on ALL nodes (including masters)
tolerations:
  - operator: Exists

# Node selector (optional — restrict to specific nodes)
nodeSelector: {}

# Priority class (optional — ensure agent isn't evicted first)
priorityClassName: ""

# Extra environment variables
extraEnv: []
#  - name: GEOIP_DB_PATH
#    value: /etc/defensia/GeoLite2-Country.mmdb

# Auto-update: agent patches its own DaemonSet to trigger rolling updates.
# Disable if using GitOps (ArgoCD, Flux) to manage updates externally.
autoUpdate:
  enabled: true

# Ingress-level firewall (nginx-ingress only).
# Patches the ingress controller's ConfigMap with deny rules.
# Disable if not using nginx-ingress (e.g. Traefik, Istio).
# IP blocking still works at the iptables/host level regardless.
ingressFirewall:
  enabled: false
  namespace: "ingress-nginx"
  configMapName: "ingress-nginx-controller"

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}
